<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Toolbox Blue Gradients -->
    <linearGradient id="boxBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <linearGradient id="boxLidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Red Bookmark Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Metal Handle & Latch Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="64" cy="114" rx="46" ry="6" fill="#000000" fill-opacity="0.15"/>

  <!-- TOOLBOX HANDLE -->
  <path d="M48 30 C48 24, 80 24, 80 30 V36 H48 Z" 
        fill="none" 
        stroke="url(#metalGrad)" 
        stroke-width="6" 
        stroke-linecap="round"/>

  <!-- TOOLBOX MAIN CONTAINER (Lid + Body) -->
  <g filter="url(#shadow)">
    <!-- Toolbox Main Lower Body -->
    <rect x="20" y="52" width="88" height="54" rx="6" fill="url(#boxBodyGrad)"/>
    
    <!-- Toolbox Lid / Top Lip -->
    <rect x="16" y="36" width="96" height="18" rx="4" fill="url(#boxLidGrad)"/>
    
    <!-- Darker Separation Line Under Lid -->
    <line x1="20" y1="54" x2="108" y2="54" stroke="#1E40AF" stroke-width="2"/>

    <!-- Metallic Center Latch -->
    <rect x="58" y="50" width="12" height="12" rx="2" fill="url(#metalGrad)" stroke="#64748B" stroke-width="1"/>
    <circle cx="64" cy="56" r="2" fill="#475569"/>
  </g>

  <!-- RED BOOKMARK RIBBON (Overlaid on top left of toolbox) -->
  <g filter="url(#shadow)">
    <!-- Main Hanging Bookmark Strap -->
    <path d="M34 32 H52 V98 L43 90 L34 98 Z" fill="url(#ribbonGrad)"/>
    
    <!-- Folded Top Lip Over the Lid (creates 3D depth wrapping around top) -->
    <path d="M34 32 C34 29, 52 29, 52 32 V36 H34 Z" fill="#991B1B"/>
    
    <!-- Subtle Stitching Lines on Ribbon Edges -->
    <line x1="36" y1="36" x2="36" y2="90" stroke="#FCA5A5" stroke-dasharray="2 2" stroke-width="1" opacity="0.6"/>
    <line x1="50" y1="36" x2="50" y2="90" stroke="#FCA5A5" stroke-dasharray="2 2" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
